  <g id="title-block">
    <text x="60" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="-3" fill="#1c1a17">VibeSplit</text>
    <text x="64" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="#1c1a17">Vibe with your crew, not your spends.</text>
    <text x="64" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#6b6358">Log who paid and who shared it. Every member</text>
    <text x="64" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#6b6358">sees what they get back or owe, in rupees.</text>
